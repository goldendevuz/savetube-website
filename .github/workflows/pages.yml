name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_BASE: /savetube-website/
      # Every page gets its own index.html, so each address answers 200 (stores and crawlers check the status);
      # 404.html still serves the app for anything else, and the app routes it on the client.
      - run: |
          cp dist/index.html dist/404.html
          for route in privacy extension-privacy dmca about download how-it-works; do
            mkdir -p "dist/$route" && cp dist/index.html "dist/$route/index.html"
          done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
